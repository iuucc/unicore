[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unicore-eeg"
version = "0.1.0"
description = "Six-expert UniCORE-EEG framework for unified EEG artifact removal."
requires-python = ">=3.11"
dependencies = [
  "torch",
  "numpy",
  "scipy",
  "matplotlib",
  "tqdm",
  "mne>=1.8,<2",
  "wfdb>=4.1,<5",
  "openneuro-py>=2024.2",
  "h5py>=3.11,<4",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "requests>=2.32,<3",
  "tabulate>=0.9,<1",
  "pyyaml>=6.0,<7",
  "psutil>=5.9,<8",
  "pytest>=8,<10",
]

[tool.setuptools.packages.find]
include = ["unicore_eeg*"]
